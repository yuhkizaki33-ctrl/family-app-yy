<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族情報共有アプリ（クラウド同期版）</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 【設定】JSONBinのマスターキーとBin IDをここに設定します
        const API_KEY = "$2a$10$upl4MvjvsdlpyVr.e0QXheTHBMDhvUcpeB3e7v2GT.a.Bgl6JvgLi"; // ←ここにJSONBinのマスターキーを入れる
        const BIN_ID = "";       // ←初回の保存で作られたBin IDを入れる

        function App() {
            const initialData = {
                daily: [
                    { id: 101, text: "牛乳（1L）", completed: false, author: "ママ", isNew: false, purchasedAt: null }
                ],
                wishes: [],
                goal: [],
                cleaning: [],
                travel: [],
                events: []
            };

            const [activeTab, setActiveTab] = useState('daily');
            const [currentUser, setCurrentUser] = useState('パパ');
            const [data, setData] = useState(initialData);
            const [isSyncing, setIsSyncing] = useState(false);

            // 起動時にクラウドからデータを取得
            useEffect(() => {
                if (BIN_ID && BIN_ID !== "$2a$10$upl4MvjvsdlpyVr.e0QXheTHBMDhvUcpeB3e7v2GT.a.Bgl6JvgLi") {
                    fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': API_KEY }
                    })
                    .then(res => res.json())
                    .then(resData => {
                        if (resData && resData.record) {
                            // 日用品の1週間自動消去チェック
                            let parsed = resData.record;
                            const now = Date.now();
                            const oneWeek = 7 * 24 * 60 * 60 * 1000;
                            if (parsed.daily) {
                                parsed.daily = parsed.daily.filter(item => {
                                    if (item.completed && item.purchasedAt) {
                                        return (now - item.purchasedAt) < oneWeek;
                                    }
                                    return true;
                                });
                            }
                            setData(parsed);
                        }
                    })
                    .catch(err => console.log("データ取得エラー:", err));
                }
            }, []);

            // データが変更されたらクラウドへ自動保存
            const saveDataToCloud = (newData) => {
                setData(newData);
                if (!API_KEY || API_KEY === "YOUR_JSON_BIN_KEY" || !BIN_ID || BIN_ID === "YOUR_BIN_ID") {
                    return; // キー未設定時はローカル保存のみのフォールバック
                }

                setIsSyncing(true);
                fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(newData)
                })
                .then(() => setIsSyncing(false))
                .catch(err => {
                    console.log("保存エラー:", err);
                    setIsSyncing(false);
                });
            };

            // 入力用フォームの状態
            const [inputText, setInputText] = useState('');
            const [inputDate, setInputDate] = useState('');
            const [inputMemo, setInputMemo] = useState('');
            const [inputNotes, setInputNotes] = useState('');
            const [inputSteps, setInputSteps] = useState('');
            const [inputAssignee, setInputAssignee] = useState('パパ');
            const [inputPlace, setInputPlace] = useState('');
            
            const [inputTravelTitle, setInputTravelTitle] = useState('');
            const [travelSpots, setTravelSpots] = useState([{ name: '', transport: '', time: '', memo: '' }]);

            const handleAddSpotField = () => {
                setTravelSpots(prev => [...prev, { name: '', transport: '', time: '', memo: '' }]);
            };

            const handleSpotChange = (index, field, value) => {
                const updated = [...travelSpots];
                updated[index][field] = value;
                setTravelSpots(updated);
            };

            const handleRemoveSpotField = (index) => {
                setTravelSpots(travelSpots.filter((_, i) => i !== index));
            };

            // アイテム追加
            const handleAddItem = (e) => {
                e.preventDefault();
                let newItem = { 
                    id: Date.now(), 
                    completed: false, 
                    author: currentUser,
                    isNew: true 
                };

                if (activeTab === 'daily') {
                    if (!inputText.trim()) return;
                    newItem.text = inputText.trim();
                    newItem.purchasedAt = null;
                } else if (activeTab === 'wishes') {
                    if (!inputText.trim()) return;
                    newItem.text = inputText.trim();
                    newItem.notes = inputNotes.trim();
                } else if (activeTab === 'goal') {
                    if (!inputText.trim()) return;
                    newItem.text = inputText.trim();
                    newItem.steps = inputSteps.split('\n').filter(s => s.trim() !== '');
                } else if (activeTab === 'cleaning') {
                    if (!inputPlace.trim()) return;
                    newItem.place = inputPlace.trim();
                    newItem.assignee = inputAssignee;
                    newItem.date = inputDate || '期限なし';
                } else if (activeTab === 'travel') {
                    if (!inputTravelTitle.trim()) return;
                    newItem.title = inputTravelTitle.trim();
                    newItem.spots = travelSpots.filter(s => s.name.trim() !== '');
                } else if (activeTab === 'events') {
                    if (!inputText.trim()) return;
                    newItem.text = inputText.trim();
                    newItem.date = inputDate;
                    newItem.memo = inputMemo.trim();
                }

                const updatedData = {
                    ...data,
                    [activeTab]: [newItem, ...data[activeTab]]
                };
                saveDataToCloud(updatedData);

                // フォームリセット
                setInputText('');
                setInputPlace('');
                setInputDate('');
                setInputMemo('');
                setInputNotes('');
                setInputSteps('');
                setInputTravelTitle('');
                setTravelSpots([{ name: '', transport: '', time: '', memo: '' }]);
            };

            // チェック切り替え
            const toggleComplete = (id) => {
                const now = Date.now();
                const updatedList = data[activeTab].map(item => {
                    if (item.id === id) {
                        const nextCompleted = !item.completed;
                        return { 
                            ...item, 
                            completed: nextCompleted, 
                            isNew: false,
                            purchasedAt: (activeTab === 'daily' && nextCompleted) ? now : (activeTab === 'daily' ? null : item.purchasedAt)
                        };
                    }
                    return item;
                });

                saveDataToCloud({
                    ...data,
                    [activeTab]: updatedList
                });
            };

            // アイテム削除
            const handleDelete = (id) => {
                saveDataToCloud({
                    ...data,
                    [activeTab]: data[activeTab].filter(item => item.id !== id)
                });
            };

            const tabConfig = {
                daily: { label: '日用品', color: 'bg-amber-500' },
                wishes: { label: '購入希望', color: 'bg-rose-500' },
                goal: { label: 'やりたい事', color: 'bg-purple-500' },
                cleaning: { label: '家の掃除', color: 'bg-teal-500' },
                travel: { label: '旅行', color: 'bg-sky-500' },
                events: { label: '瑠華情報', color: 'bg-emerald-500' }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl relative">
                    {/* 同期ステータス表示 */}
                    {isSyncing && (
                        <div className="absolute top-2 right-2 bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full shadow animate-pulse z-50">
                            同期中...
                        </div>
                    )}

                    {/* ヘッダー */}
                    <header className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-4 shadow-md flex justify-between items-center">
                        <h1 className="text-base font-bold tracking-wide">🏠 家族情報共有</h1>
                        <div className="flex items-center bg-indigo-900/40 p-1 rounded-lg border border-indigo-400/30">
                            <span className="text-[10px] px-1 text-indigo-200">使用者:</span>
                            <button
                                onClick={() => setCurrentUser('パパ')}
                                className={`px-2.5 py-1 text-xs font-bold rounded-md transition ${currentUser === 'パパ' ? 'bg-white text-indigo-700 shadow-sm' : 'text-white hover:text-indigo-200'}`}
                            >
                                パパ
                            </button>
                            <button
                                onClick={() => setCurrentUser('ママ')}
                                className={`px-2.5 py-1 text-xs font-bold rounded-md transition ${currentUser === 'ママ' ? 'bg-white text-indigo-700 shadow-sm' : 'text-white hover:text-indigo-200'}`}
                            >
                                ママ
                            </button>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="grid grid-cols-6 bg-slate-100 p-1 border-b border-slate-200 text-center">
                        {Object.keys(tabConfig).map(tabKey => {
                            const isActive = activeTab === tabKey;
                            return (
                                <button
                                    key={tabKey}
                                    onClick={() => setActiveTab(tabKey)}
                                    className={`py-2 px-0.5 text-[10px] font-semibold rounded-lg transition-all flex flex-col items-center justify-center ${
                                        isActive ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <span>{tabConfig[tabKey].label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* メインコンテンツ */}
                    <main className="flex-1 p-4 overflow-y-auto pb-24">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                <span className={`w-3 h-3 rounded-full ${tabConfig[activeTab].color}`}></span>
                                {tabConfig[activeTab].label}リスト
                            </h2>
                            <span className="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">
                                ✎ 投稿者: <strong className="text-indigo-600">{currentUser}</strong>
                            </span>
                        </div>

                        {/* 入力フォーム */}
                        <form onSubmit={handleAddItem} className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 shadow-sm space-y-3">
                            {activeTab === 'daily' && (
                                <input
                                    type="text"
                                    placeholder="買う日用品を入力（例：ティッシュ）"
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            )}
                            {activeTab === 'wishes' && (
                                <>
                                    <input
                                        type="text"
                                        placeholder="欲しいもの・購入希望を入力"
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <textarea
                                        placeholder="悩んでいることや結論のまとめスペース"
                                        value={inputNotes}
                                        onChange={(e) => setInputNotes(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 h-20"
                                    />
                                </>
                            )}
                            {activeTab === 'goal' && (
                                <>
                                    <input
                                        type="text"
                                        placeholder="やりたい事を入力（例：家族旅行）"
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <textarea
                                        placeholder="達成までに必要な項目（1行につき1つ入力）"
                                        value={inputSteps}
                                        onChange={(e) => setInputSteps(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 h-20"
                                    />
                                </>
                            )}
                            {activeTab === 'cleaning' && (
                                <>
                                    <input
                                        type="text"
                                        placeholder="掃除箇所（例：換気扇、お風呂など）"
                                        value={inputPlace}
                                        onChange={(e) => setInputPlace(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">担当者</label>
                                            <select
                                                value={inputAssignee}
                                                onChange={(e) => setInputAssignee(e.target.value)}
                                                className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            >
                                                <option value="パパ">パパ</option>
                                                <option value="ママ">ママ</option>
                                                <option value="ふたり">ふたり</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">期限</label>
                                            <input
                                                type="date"
                                                value={inputDate}
                                                onChange={(e) => setInputDate(e.target.value)}
                                                className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                    </div>
                                </>
                            )}
                            {activeTab === 'travel' && (
                                <div className="space-y-3">
                                    <input
                                        type="text"
                                        placeholder="旅行のタイトル（例：春の箱根・小田原旅行）"
                                        value={inputTravelTitle}
                                        onChange={(e) => setInputTravelTitle(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold"
                                    />
                                    <div className="border-t border-slate-200 pt-2">
                                        <label className="text-xs font-bold text-slate-600 block mb-2">📍 訪問する目的地（複数スポット）</label>
                                        {travelSpots.map((spot, index) => (
                                            <div key={index} className="bg-white p-2.5 rounded-lg border border-slate-200 mb-2 space-y-2 relative shadow-2xs">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-[10px] font-bold text-indigo-600">スポット #{index + 1}</span>
                                                    {travelSpots.length > 1 && (
                                                        <button type="button" onClick={() => handleRemoveSpotField(index)} className="text-slate-400 hover:text-rose-500 text-xs px-1">✕ 削除</button>
                                                    )}
                                                </div>
                                                <input
                                                    type="text"
                                                    placeholder="目的地・スポット名"
                                                    value={spot.name}
                                                    onChange={(e) => handleSpotChange(index, 'name', e.target.value)}
                                                    className="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                />
                                                <div className="grid grid-cols-2 gap-1.5">
                                                    <input
                                                        type="text"
                                                        placeholder="移動方法"
                                                        value={spot.transport}
                                                        onChange={(e) => handleSpotChange(index, 'transport', e.target.value)}
                                                        className="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="時間"
                                                        value={spot.time}
                                                        onChange={(e) => handleSpotChange(index, 'time', e.target.value)}
                                                        className="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                    />
                                                </div>
                                                <input
                                                    type="text"
                                                    placeholder="備考・メモ"
                                                    value={spot.memo}
                                                    onChange={(e) => handleSpotChange(index, 'memo', e.target.value)}
                                                    className="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                />
                                            </div>
                                        ))}
                                        <button type="button" onClick={handleAddSpotField} className="w-full py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
                                            ＋ 別の目的地スポットを追加する
                                        </button>
                                    </div>
                                </div>
                            )}
                            {activeTab === 'events' && (
                                <>
                                    <input
                                        type="text"
                                        placeholder="瑠華情報のタイトル（例：予防接種）"
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <div>
                                        <label className="text-[10px] text-slate-500 block mb-1">期日</label>
                                        <input
                                            type="date"
                                            value={inputDate}
                                            onChange={(e) => setInputDate(e.target.value)}
                                            className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <textarea
                                        placeholder="情報の詳細（メモなど）"
                                        value={inputMemo}
                                        onChange={(e) => setInputMemo(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 h-16"
                                    />
                                </>
                            )}
                            <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition shadow-sm">
                                【{currentUser}】として追加する
                            </button>
                        </form>

                        {/* リスト一覧表示 */}
                        {activeTab === 'daily' ? (
                            <div className="space-y-4">
                                <div>
                                    <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">未購入リスト</h3>
                                    <div className="space-y-2">
                                        {data.daily.filter(i => !i.completed).length === 0 ? (
                                            <p className="text-center text-slate-400 py-4 text-xs bg-white rounded-xl border border-slate-200">買うものはありません</p>
                                        ) : (
                                            data.daily.filter(i => !i.completed).map(item => (
                                                <div key={item.id} className={`flex items-start justify-between p-3 bg-white border rounded-xl shadow-sm transition ${item.isNew ? 'border-indigo-400 ring-2 ring-indigo-100 bg-indigo-50/20' : 'border-slate-200'}`}>
                                                    <div className="flex items-start gap-3 flex-1">
                                                        <input
                                                            type="checkbox"
                                                            checked={item.completed}
                                                            onChange={() => toggleComplete(item.id)}
                                                            className="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                                                        />
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-2 flex-wrap mb-1">
                                                                {item.isNew && <span className="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded animate-pulse">NEW</span>}
                                                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${item.author === 'パパ' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>{item.author}</span>
                                                            </div>
                                                            <p className="text-sm font-medium text-slate-800">{item.text}</p>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleDelete(item.id)} className="text-slate-400 hover:text-rose-500 p-1 text-sm transition" title="削除">✕</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">🛒 購入した枠（1週間で自動消去）</h3>
                                    <div className="space-y-2">
                                        {data.daily.filter(i => i.completed).length === 0 ? (
                                            <p className="text-center text-slate-400 py-4 text-xs bg-white rounded-xl border border-slate-200">購入済みのものはありません</p>
                                        ) : (
                                            data.daily.filter(i => i.completed).map(item => (
                                                <div key={item.id} className="flex items-start justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-sm opacity-75">
                                                    <div className="flex items-start gap-3 flex-1">
                                                        <input
                                                            type="checkbox"
                                                            checked={item.completed}
                                                            onChange={() => toggleComplete(item.id)}
                                                            className="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                                                        />
                                                        <div className="flex-1">
                                                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${item.author === 'パパ' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>{item.author}</span>
                                                            <p className="text-sm font-medium line-through text-slate-400 mt-1">{item.text}</p>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleDelete(item.id)} className="text-slate-400 hover:text-rose-500 p-1 text-sm transition" title="削除">✕</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {data[activeTab].length === 0 ? (
                                    <p className="text-center text-slate-400 py-8 text-sm bg-white rounded-xl border border-slate-200">項目はまだありません</p>
                                ) : (
                                    data[activeTab].map(item => (
                                        <div key={item.id} className={`flex items-start justify-between p-3 bg-white border rounded-xl shadow-sm transition ${item.isNew ? 'border-indigo-400 ring-2 ring-indigo-100 bg-indigo-50/20' : 'border-slate-200'}`}>
                                            <div className="flex items-start gap-3 flex-1">
                                                {activeTab === 'cleaning' && (
                                                    <input
                                                        type="checkbox"
                                                        checked={item.completed}
                                                        onChange={() => toggleComplete(item.id)}
                                                        className="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                                                    />
                                                )}
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 flex-wrap mb-1">
                                                        {item.isNew && <span className="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded animate-pulse">NEW</span>}
                                                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${item.author === 'パパ' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>{item.author}</span>
                                                    </div>
                                                    {activeTab === 'wishes' && (
                                                        <div>
                                                            <p className="text-sm font-bold text-slate-800">{item.text}</p>
                                                            {item.notes && <div className="mt-2 p-2 bg-amber-50/60 border border-amber-200 rounded-lg text-xs text-slate-700 whitespace-pre-wrap">💡 <strong className="text-amber-800">結論・悩みまとめ:</strong><br/>{item.notes}</div>}
                                                        </div>
                                                    )}
                                                    {activeTab === 'goal' && (
                                                        <div>
                                                            <p className="text-sm font-bold text-slate-800">🎯 {item.text}</p>
                                                            {item.steps && item.steps.length > 0 && (
                                                                <div className="mt-2 p-2 bg-purple-50/60 border border-purple-200 rounded-lg text-xs text-slate-700">
                                                                    <strong className="text-purple-800 block mb-1">📋 達成までに必要な項目:</strong>
                                                                    <ul className="list-disc list-inside space-y-0.5">
                                                                        {item.steps.map((step, idx) => <li key={idx}>{step}</li>)}
                                                                    </ul>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                    {activeTab === 'cleaning' && (
                                                        <div>
                                                            <p className={`text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>🧹 {item.place}</p>
                                                            <div className="flex gap-3 mt-1 text-xs">
                                                                <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium">担当: {item.assignee}</span>
                                                                <span className="text-slate-500 self-center">📅 期限: {item.date}</span>
                                                            </div>
                                                        </div>
                                                    )}
                                                    {activeTab === 'travel' && (
                                                        <div>
                                                            <p className="text-sm font-bold text-slate-900 mb-2">✈️ {item.title}</p>
                                                            {item.spots && item.spots.length > 0 && (
                                                                <div className="space-y-2 border-l-2 border-sky-300 pl-3">
                                                                    {item.spots.map((spot, idx) => (
                                                                        <div key={idx} className="bg-sky-50/50 p-2 rounded-lg border border-sky-100 text-xs text-slate-700">
                                                                            <p className="font-bold text-sky-900">📍 {idx + 1}. {spot.name}</p>
                                                                            {spot.transport && <p className="mt-0.5">🚗 移動: {spot.transport}</p>}
                                                                            {spot.time && <p>⏰ 時間: {spot.time}</p>}
                                                                            {spot.memo && <p className="text-slate-500 mt-1">📝 備考: {spot.memo}</p>}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                    {activeTab === 'events' && (
                                                        <div>
                                                            <p className="text-sm font-bold text-slate-800">📌 {item.text}</p>
                                                            {item.date && <p className="text-xs text-emerald-600 font-semibold mt-0.5">⏳ 期日: {item.date}</p>}
                                                            {item.memo && <p className="text-xs text-slate-600 mt-1 p-2 bg-slate-50 rounded border border-slate-100 whitespace-pre-wrap">{item.memo}</p>}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <button onClick={() => handleDelete(item.id)} className="text-slate-400 hover:text-rose-500 p-1 text-sm transition" title="削除">✕</button>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
