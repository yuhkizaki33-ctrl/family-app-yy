<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族情報共有アプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // 初期データ（サンプル）
            const initialData = {
                shopping: [
                    { id: 1, text: "牛乳（1L）", completed: false },
                    { id: 2, text: "卵（1パック）", completed: true },
                    { id: 3, text: "お米 5kg", completed: false }
                ],
                wishes: [
                    { id: 1, text: "家族みんなで温泉旅行に行く", completed: false },
                    { id: 2, text: "リビングの模様替えをする", completed: false },
                    { id: 3, text: "新しいホットプレートを買う", completed: true }
                ],
                travel: [
                    { id: 1, text: "春の箱根旅行（計画中）", date: "2026-04-15", memo: "露天風呂付き客室を予約する" },
                    { id: 2, text: "夏休みの沖縄リゾート", date: "2026-08-10", memo: "飛行機のチケットを早めに取る" }
                ],
                events: [
                    { id: 1, text: "瑠華の保育園遠足", date: "2026-05-12", memo: "お弁当とおやつの準備を忘れない" },
                    { id: 2, text: "瑠華の誕生日パーティー", date: "2026-07-20", memo: "ケーキの予約とプレゼント用意" }
                ]
            };

            // ローカルストレージからデータを読み込む（なければ初期データ）
            const [activeTab, setActiveTab] = useState('shopping');
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem('family_app_data');
                return saved ? JSON.parse(saved) : initialData;
            });

            const [inputText, setInputText] = useState('');
            const [inputDate, setInputDate] = useState('');
            const [inputMemo, setInputMemo] = useState('');

            // データが変更されたらローカルストレージに保存
            useEffect(() => {
                localStorage.setItem('family_app_data', JSON.stringify(data));
            }, [data]);

            // アイテム追加
            const handleAddItem = (e) => {
                e.preventDefault();
                if (!inputText.trim()) return;

                const newItem = {
                    id: Date.now(),
                    text: inputText.trim(),
                    completed: false,
                    date: inputDate || undefined,
                    memo: inputMemo.trim() || undefined
                };

                setData(prev => ({
                    ...prev,
                    [activeTab]: [newItem, ...prev[activeTab]]
                }));

                setInputText('');
                setInputDate('');
                setInputMemo('');
            };

            // チェック切り替え（買い物・やりたい事用）
            const toggleComplete = (id) => {
                setData(prev => ({
                    ...prev,
                    [activeTab]: prev[activeTab].map(item => 
                        item.id === id ? { ...item, completed: !item.completed } : item
                    )
                }));
            };

            // アイテム削除
            const handleDelete = (id) => {
                setData(prev => ({
                    ...prev,
                    [activeTab]: prev[activeTab].filter(item => item.id !== id)
                }));
            };

            const tabConfig = {
                shopping: { label: '買い物リスト', icon: 'shopping-cart', color: 'bg-amber-500' },
                wishes: { label: 'やりたい事', icon: 'heart', color: 'bg-rose-500' },
                travel: { label: '旅行リスト', icon: 'plane', color: 'bg-sky-500' },
                events: { label: '瑠華イベント', icon: 'calendar', color: 'bg-emerald-500' }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl">
                    {/* ヘッダー */}
                    <header className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-6 shadow-md">
                        <h1 className="text-2xl font-bold text-center tracking-wide">🏠 家族情報共有</h1>
                        <p className="text-xs text-indigo-100 text-center mt-1">みんなの予定とリストをひとつに</p>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="grid grid-cols-4 bg-slate-100 p-1 border-b border-slate-200">
                        {Object.keys(tabConfig).map(tabKey => {
                            const isActive = activeTab === tabKey;
                            return (
                                <button
                                    key={tabKey}
                                    onClick={() => setActiveTab(tabKey)}
                                    className={`py-3 text-xs font-semibold rounded-lg transition-all flex flex-col items-center justify-center gap-1 ${
                                        isActive 
                                            ? 'bg-white text-indigo-600 shadow-sm' 
                                            : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <span>{tabConfig[tabKey].label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* メインコンテンツ */}
                    <main className="flex-1 p-4 overflow-y-auto pb-24">
                        <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <span className={`w-3 h-3 rounded-full ${tabConfig[activeTab].color}`}></span>
                            {tabConfig[activeTab].label}
                        </h2>

                        {/* 入力フォーム */}
                        <form onSubmit={handleAddItem} className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 shadow-sm space-y-3">
                            <input
                                type="text"
                                placeholder={activeTab === 'shopping' ? "買うものを入力..." : activeTab === 'wishes' ? "やりたい事を入力..." : activeTab === 'travel' ? "旅行の行き先を入力..." : "イベント名を入力..."}
                                value={inputText}
                                onChange={(e) => setInputText(e.target.value)}
                                className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />

                            {(activeTab === 'travel' || activeTab === 'events') && (
                                <input
                                    type="date"
                                    value={inputDate}
                                    onChange={(e) => setInputDate(e.target.value)}
                                    className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            )}

                            {(activeTab === 'travel' || activeTab === 'events' || activeTab === 'wishes') && (
                                <input
                                    type="text"
                                    placeholder="メモ（任意）"
                                    value={inputMemo}
                                    onChange={(e) => setInputMemo(e.target.value)}
                                    className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            )}

                            <button
                                type="submit"
                                className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition shadow-sm"
                            >
                                追加する
                            </button>
                        </form>

                        {/* リスト一覧 */}
                        <div className="space-y-2">
                            {data[activeTab].length === 0 ? (
                                <p className="text-center text-slate-400 py-8 text-sm">項目はまだありません</p>
                            ) : (
                                data[activeTab].map(item => (
                                    <div 
                                        key={item.id}
                                        className="flex items-start justify-between p-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-slate-300 transition"
                                    >
                                        <div className="flex items-start gap-3 flex-1">
                                            {(activeTab === 'shopping' || activeTab === 'wishes') && (
                                                <input
                                                    type="checkbox"
                                                    checked={item.completed}
                                                    onChange={() => toggleComplete(item.id)}
                                                    className="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                                                />
                                            )}
                                            <div className="flex-1">
                                                <p className={`text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                                    {item.text}
                                                </p>
                                                {item.date && (
                                                    <p className="text-xs text-indigo-600 font-semibold mt-0.5">📅 {item.date}</p>
                                                )}
                                                {item.memo && (
                                                    <p className="text-xs text-slate-500 mt-0.5">{item.memo}</p>
                                                )}
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => handleDelete(item.id)}
                                            className="text-slate-400 hover:text-rose-500 p-1 text-sm transition"
                                            title="削除"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
