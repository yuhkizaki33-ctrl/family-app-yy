<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族情報共有アプリ（同期版）</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // ▼ ここにJSONBinの情報を正しく貼り付けてください ▼
        // ==========================================
        const BIN_ID = "6aef1b3bffd5d16053aedd5a"; 
        const MASTER_KEY = "$2a$10$R9tRX4UbOa39q8AVRyQ/r.WvHdmrVwXZgaBKKUBQnZZ5uYGWIQDoO";

        function App() {
            const [activeTab, setActiveTab] = useState('daily');
            const [currentUser, setCurrentUser] = useState('パパ');
            const [isLoading, setIsLoading] = useState(false);

            const [data, setData] = useState({
                daily: [],
                wishes: [],
                cleaning: [],
                travel: [],
                events: []
            });

            // 入力用フォームの状態
            const [inputText, setInputText] = useState('');
            const [inputDate, setInputDate] = useState('');
            const [inputMemo, setInputMemo] = useState('');
            const [inputAssignee, setInputAssignee] = useState('パパ');
            const [inputPlace, setInputPlace] = useState('');

            // サーバーからデータを取得（同期）
            const fetchData = async () => {
                if (!BIN_ID || BIN_ID.includes("ここ")) return;
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: {
                            'X-Master-Key': MASTER_KEY
                        }
                    });
                    const resData = await response.json();
                    if (resData && resData.record) {
                        setData(resData.record);
                    }
                } catch (error) {
                    console.error("データの取得に失敗しました", error);
                }
            };

            // 初回読み込み ＆ 5秒ごとに自動同期
            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 5000);
                return () => clearInterval(interval);
            }, []);

            // サーバーへデータを保存・更新する関数
            const saveToServer = async (newData) => {
                setData(newData); // 画面を即座に更新
                if (!BIN_ID || BIN_ID.includes("ここ")) return;

                setIsLoading(true);
                try {
                    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': MASTER_KEY
                        },
                        body: JSON.stringify(newData)
                    });
                } catch (error) {
                    console.error("データの保存に失敗しました", error);
                } finally {
                    setIsLoading(false);
                }
            };

            // アイテム追加
            const handleAddItem = (e) => {
                e.preventDefault();
                
                let newItem = { 
                    id: Date.now(), 
                    completed: false, 
                    author: currentUser,
                    isNew: true 
                };

                if (activeTab === 'cleaning') {
                    if (!inputPlace.trim()) return;
                    newItem.place = inputPlace.trim();
                    newItem.assignee = inputAssignee;
                    newItem.date = inputDate || '期限なし';
                } else {
                    if (!inputText.trim()) return;
                    newItem.text = inputText.trim();
                    newItem.date = inputDate || undefined;
                    newItem.memo = inputMemo.trim() || undefined;
                }

                const updatedData = {
                    ...data,
                    [activeTab]: [newItem, ...(data[activeTab] || [])]
                };

                saveToServer(updatedData);

                setInputText('');
                setInputPlace('');
                setInputDate('');
                setInputMemo('');
            };

            // チェック切り替え
            const toggleComplete = (id) => {
                const updatedData = {
                    ...data,
                    [activeTab]: (data[activeTab] || []).map(item => 
                        item.id === id ? { ...item, completed: !item.completed, isNew: false } : item
                    )
                };
                saveToServer(updatedData);
            };

            // アイテム削除
            const handleDelete = (id) => {
                const updatedData = {
                    ...data,
                    [activeTab]: (data[activeTab] || []).filter(item => item.id !== id)
                };
                saveToServer(updatedData);
            };

            const tabConfig = {
                daily: { label: '日用品', color: 'bg-amber-500' },
                wishes: { label: '買いたいもの', color: 'bg-rose-500' },
                cleaning: { label: '家の掃除', color: 'bg-teal-500' },
                travel: { label: '旅行リスト', color: 'bg-sky-500' },
                events: { label: '瑠華イベント', color: 'bg-emerald-500' }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl">
                    {/* ヘッダー */}
                    <header className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-4 shadow-md flex justify-between items-center">
                        <div>
                            <h1 className="text-lg font-bold tracking-wide">🏠 家族共有アプリ</h1>
                            {isLoading && <span className="text-[10px] text-indigo-200">同期中...</span>}
                        </div>
                        
                        {/* アカウント切り替えスイッチ */}
                        <div className="flex items-center bg-indigo-900/40 p-1 rounded-lg border border-indigo-400/30">
                            <span className="text-[10px] px-1 text-indigo-200">使用者:</span>
                            <button
                                onClick={() => setCurrentUser('パパ')}
                                className={`px-2.5 py-1 text-xs font-bold rounded-md transition ${currentUser === 'パパ' ? 'bg-white text-indigo-700 shadow-sm' : 'text-white hover:text-indigo-200'}`}
                            >
                                パパ
                            </button>
                            <button
                                onClick={() => setCurrentUser('ママ')}
                                className={`px-2.5 py-1 text-xs font-bold rounded-md transition ${currentUser === 'ママ' ? 'bg-white text-indigo-700 shadow-sm' : 'text-white hover:text-indigo-200'}`}
                            >
                                ママ
                            </button>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="grid grid-cols-5 bg-slate-100 p-1 border-b border-slate-200 text-center">
                        {Object.keys(tabConfig).map(tabKey => {
                            const isActive = activeTab === tabKey;
                            return (
                                <button
                                    key={tabKey}
                                    onClick={() => setActiveTab(tabKey)}
                                    className={`py-2 px-1 text-[11px] font-semibold rounded-lg transition-all flex flex-col items-center justify-center ${
                                        isActive 
                                            ? 'bg-white text-indigo-600 shadow-sm' 
                                            : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <span>{tabConfig[tabKey].label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* メインコンテンツ */}
                    <main className="flex-1 p-4 overflow-y-auto pb-24">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                <span className={`w-3 h-3 rounded-full ${tabConfig[activeTab].color}`}></span>
                                {tabConfig[activeTab].label}
                            </h2>
                            <span className="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">
                                ✎ 投稿者: <strong className="text-indigo-600">{currentUser}</strong>
                            </span>
                        </div>

                        {/* 入力フォーム */}
                        <form onSubmit={handleAddItem} className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 shadow-sm space-y-3">
                            {activeTab === 'cleaning' ? (
                                <>
                                    <input
                                        type="text"
                                        placeholder="掃除箇所（例：換気扇、お風呂など）"
                                        value={inputPlace}
                                        onChange={(e) => setInputPlace(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">担当者</label>
                                            <select
                                                value={inputAssignee}
                                                onChange={(e) => setInputAssignee(e.target.value)}
                                                className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            >
                                                <option value="パパ">パパ</option>
                                                <option value="ママ">ママ</option>
                                                <option value="ふたり">ふたり</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-500 block mb-1">期限</label>
                                            <input
                                                type="date"
                                                value={inputDate}
                                                onChange={(e) => setInputDate(e.target.value)}
                                                className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <input
                                        type="text"
                                        placeholder={
                                            activeTab === 'daily' ? "買う日用品を入力（例：ティッシュ）" :
                                            activeTab === 'wishes' ? "欲しいものを入力（例：カメラ）" :
                                            activeTab === 'travel' ? "旅行の行き先を入力..." : "イベント名を入力..."
                                        }
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />

                                    {(activeTab === 'travel' || activeTab === 'events') && (
                                        <input
                                            type="date"
                                            value={inputDate}
                                            onChange={(e) => setInputDate(e.target.value)}
                                            className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    )}

                                    {(activeTab === 'travel' || activeTab === 'events' || activeTab === 'wishes') && (
                                        <input
                                            type="text"
                                            placeholder="メモ（任意）"
                                            value={inputMemo}
                                            onChange={(e) => setInputMemo(e.target.value)}
                                            className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    )}
                                </>
                            )}

                            <button
                                type="submit"
                                className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition shadow-sm"
                            >
                                【{currentUser}】として追加する
                            </button>
                        </form>

                        {/* リスト一覧 */}
                        <div className="space-y-2">
                            {(!data[activeTab] || data[activeTab].length === 0) ? (
                                <p className="text-center text-slate-400 py-8 text-sm">項目はまだありません</p>
                            ) : (
                                data[activeTab].map(item => (
                                    <div 
                                       key={item.id}
                                       className={`flex items-start justify-between p-3 bg-white border rounded-xl shadow-sm transition ${item.isNew ? 'border-indigo-400 ring-2 ring-indigo-100 bg-indigo-50/20' : 'border-slate-200'}`}
                                    >
                                        <div className="flex items-start gap-3 flex-1">
                                            {/* チェックボックス */}
                                            {(activeTab === 'daily' || activeTab === 'wishes' || activeTab === 'cleaning') && (
                                                <input
                                                    type="checkbox"
                                                    checked={item.completed}
                                                    onChange={() => toggleComplete(item.id)}
                                                    className="mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                                                />
                                            )}
                                            
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 flex-wrap mb-1">
                                                    {item.isNew && (
                                                        <span className="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded animate-pulse">
                                                            NEW
                                                        </span>
                                                    )}
                                                    <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${item.author === 'パパ' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>
                                                        {item.author}
                                                    </span>
                                                </div>

                                                {activeTab === 'cleaning' ? (
                                                    <div>
                                                        <p className={`text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                                            🧹 {item.place}
                                                        </p>
                                                        <div className="flex gap-3 mt-1 text-xs">
                                                            <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium">担当: {item.assignee}</span>
                                                            <span className="text-slate-500 self-center">📅 期限: {item.date}</span>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <p className={`text-sm font-medium ${item.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                                            {item.text}
                                                        </p>
                                                        {item.date && (
                                                            <p className="text-xs text-indigo-600 font-semibold mt-0.5">📅 {item.date}</p>
                                                        )}
                                                        {item.memo && (
                                                            <p className="text-xs text-slate-500 mt-0.5">{item.memo}</p>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => handleDelete(item.id)}
                                            className="text-slate-400 hover:text-rose-500 p-1 text-sm transition"
                                            title="削除"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
